<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crashpot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Cairo:wght@600;800&family=Rubik:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#1a1140;
  --panel:#241a55;
  --raise:#30236f;
  --ink:#fff4dc;
  --dim:#a99dd9;
  --coral:#ff6b57;
  --coral-d:#b8392b;
  --butter:#ffd43b;
  --butter-d:#c99a0c;
  --mint:#4be3b0;
  --mint-d:#1f9a73;
  --cardink:#2a1650;
  --line:rgba(255,244,220,.13);
  --display:"Bungee","Arial Black",Impact,system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 22px}
h1,h2,h3{margin:0;text-wrap:balance}
.brand{display:flex;flex-direction:column;gap:4px;padding-top:8px}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,13vw,68px);line-height:.9;letter-spacing:.01em;color:var(--butter)}
.brand h1 span{color:var(--coral)}
.tag{margin:0;color:var(--dim);font-size:16px}
.panel{background:var(--panel);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.06em;color:var(--dim)}
label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700}
input{font:inherit;font-size:17px;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0;outline:none}
input:focus{border-color:var(--butter)}
#code{font-family:var(--display);letter-spacing:.2em;text-transform:uppercase}
.row{display:flex;gap:10px;align-items:stretch}
.row>*{min-width:0}
.btn{appearance:none;border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:16px;cursor:pointer;background:var(--raise);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn:focus-visible,.card:focus-visible,.open:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.btn.primary{background:var(--butter);color:var(--cardink);box-shadow:0 4px 0 var(--butter-d)}
.btn.hot{background:var(--coral);color:var(--cardink);box-shadow:0 4px 0 var(--coral-d)}
.btn.ghost{background:transparent;border:2px solid var(--line);box-shadow:none}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.grow{flex:1}
.note{font-size:13px;color:var(--dim);margin:0}
.note.warn{color:var(--coral)}
.opens{display:flex;flex-direction:column;gap:8px}
.open{display:flex;align-items:center;gap:12px;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.open:hover{border-color:var(--butter)}
.open .dot{width:14px;height:14px;border-radius:50%;flex:none}
.open .om{flex:1;min-width:0;font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.open .om b{color:var(--ink);font-weight:700;font-size:15px}
.open[disabled]{opacity:.5;cursor:wait}
.open .ob{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mint)}
.open .ob.busy{color:var(--dim)}
.rules{display:grid;gap:10px;padding:4px 2px}
.rules h2{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.06em;color:var(--dim)}
.rule{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-size:14px}
.ar{font-family:"Cairo",var(--body)}
.rules.ar h2{font-family:"Cairo",var(--body);font-weight:800;font-size:16px;letter-spacing:0}
.mod .md.ar{font-weight:700;opacity:.85}
.rule i{font-style:normal;font-family:var(--display);font-size:14px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--panel);color:var(--butter)}
.top{display:flex;align-items:center;gap:10px}
.top .rd{font-family:var(--display);font-size:14px;letter-spacing:.06em;color:var(--dim)}
.top .rd b{color:var(--ink);font-weight:400}
.top .sp{flex:1}
.codepill{font-family:var(--display);font-size:13px;letter-spacing:.12em;background:var(--panel);padding:6px 10px;border-radius:999px;color:var(--butter)}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.chip{background:var(--panel);border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"dot nm" "sc st";column-gap:8px;row-gap:2px;align-items:center;border:2px solid transparent;min-width:0}
.chip.me{border-color:var(--line)}
.chip .dot{grid-area:dot;width:10px;height:10px;border-radius:50%}
.chip .nm{grid-area:nm;font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip .nm small{font-weight:500;color:var(--dim);font-size:10px;letter-spacing:.06em;margin-left:4px}
.chip .sc{grid-area:sc;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;line-height:1}
.chip .st{grid-area:st;justify-self:end;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.chip .st.ready{color:var(--mint)}
.chip .st.plus{color:var(--mint);font-family:var(--display);font-size:15px;letter-spacing:0}
.chip .st.minus{color:var(--coral);font-family:var(--display);font-size:15px;letter-spacing:0}
.mod{border-radius:16px;padding:12px 16px;background:var(--coral);color:var(--cardink);display:flex;flex-direction:column;gap:2px}
.mod.final{background:var(--butter)}
.mod .mn{font-family:var(--display);font-size:24px;line-height:1.05}
.mod .md{font-weight:600;font-size:14px}
.mod.enter{animation:slam .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{from{transform:scale(1.25) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.timer{height:10px;border-radius:999px;background:var(--panel);overflow:hidden;position:relative}
.timer i{position:absolute;inset:0;background:var(--mint);transform-origin:left;border-radius:999px}
.timer i.hot{background:var(--coral)}
.table{flex:1;min-height:210px;background:var(--panel);border-radius:20px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;position:relative;overflow:hidden}
.potlbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:800}
.potbig{font-family:var(--display);font-size:clamp(64px,22vw,104px);line-height:.9;color:var(--butter);font-variant-numeric:tabular-nums}
.potbig small{font-size:.32em;color:var(--coral);vertical-align:top;margin-left:6px}
.jack{font-size:13px;font-weight:800;color:var(--coral);letter-spacing:.04em}
.secs{font-family:var(--display);font-size:16px;color:var(--dim);font-variant-numeric:tabular-nums}
.prompt{font-size:15px;color:var(--ink);font-weight:500}
.prompt b{font-family:var(--display);font-weight:400;color:var(--coral)}
.headline{font-family:var(--display);font-size:clamp(20px,6vw,28px);line-height:1.1;color:var(--ink)}
.headline.crash{color:var(--coral)}
.sub{font-size:14px;color:var(--dim);font-weight:500}
.sub b{color:var(--coral)}
.reveal{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%}
.rv{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px}
.rv .who{font-size:12px;font-weight:700;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc{position:relative;width:62px;aspect-ratio:5/7;border-radius:12px;background:var(--butter);color:var(--cardink);display:grid;place-items:center;font-family:var(--display);font-size:30px;box-shadow:0 4px 0 var(--butter-d)}
.rc.crash{background:var(--raise);color:var(--dim);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.rc.win{background:var(--mint);box-shadow:0 4px 0 var(--mint-d),0 0 0 4px var(--ink)}
.rc.boom{background:var(--coral);box-shadow:0 4px 0 var(--coral-d)}
.rc .stamp{position:absolute;left:50%;top:82%;transform:translate(-50%,-50%) rotate(-12deg);font-size:12px;letter-spacing:.06em;background:var(--coral);color:var(--cardink);padding:2px 6px;border-radius:4px;white-space:nowrap}
.rc.boom .stamp{background:var(--cardink);color:var(--coral)}
.rc .crown{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:11px;background:var(--ink);color:var(--cardink);padding:1px 6px;border-radius:999px;font-family:var(--body);font-weight:800;letter-spacing:.06em}
.rc .auto{position:absolute;bottom:3px;font-family:var(--body);font-size:9px;font-weight:800;letter-spacing:.06em;opacity:.75}
.anim .rv{animation:flip .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*.14s)}
.anim .rc.crash{animation:shake .4s both;animation-delay:calc(var(--n)*.14s + .55s)}
.anim .rc.win{animation:pop .6s both;animation-delay:calc(var(--n)*.14s + .5s)}
.anim .late{animation:fade .4s both;animation-delay:calc(var(--n)*.14s + .45s)}
@keyframes flip{from{transform:rotateY(90deg) translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-4deg)}40%{transform:translateX(6px) rotate(4deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22) rotate(-4deg)}100%{transform:scale(1.06)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.minechip{font-family:var(--display);font-size:13px;background:var(--coral);color:var(--cardink);padding:4px 10px;border-radius:999px}
.hand{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;padding-top:8px}
.card{appearance:none;border:0;display:grid;place-items:center;width:100%;aspect-ratio:5/7;border-radius:11px;background:var(--butter);color:var(--cardink);font-family:var(--display);font-size:clamp(20px,6.4vw,30px);box-shadow:0 4px 0 var(--butter-d);cursor:pointer;transition:transform .12s,background .12s;padding:0}
.card:hover{transform:translateY(-3px)}
.card.sel{background:var(--coral);box-shadow:0 5px 0 var(--coral-d),0 0 0 3px var(--ink);transform:translateY(-10px)}
.card.used{opacity:.16;cursor:default;box-shadow:none;transform:none}
.card[disabled]{cursor:default}
.handlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.big{font-family:var(--display);font-size:clamp(24px,8vw,36px);line-height:1.05;color:var(--butter);overflow-wrap:anywhere}
.lob{display:flex;flex-direction:column;gap:8px}
.lp{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:10px 12px}
.lp .dot{width:12px;height:12px;border-radius:50%;flex:none}
.lp .n{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp .t{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.lp .x{appearance:none;background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer;padding:0 4px}
.empty{border:2px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--dim);font-size:13px}
.rank{display:flex;flex-direction:column;gap:8px;width:100%}
.rk{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px;text-align:left}
.rk .p{font-family:var(--display);font-size:16px;color:var(--dim)}
.rk.first{background:var(--butter);color:var(--cardink)}
.rk.first .p{color:var(--cardink)}
.rk .n{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .s{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.facts{display:grid;gap:6px;width:100%;text-align:left}
.fact{font-size:13px;color:var(--dim)}
.fact b{color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}
.mute{appearance:none;border:2px solid var(--line);background:transparent;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;letter-spacing:.06em;cursor:pointer;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:380px){.hand{gap:5px}.rv{width:58px}.rc{width:54px;font-size:26px}}
.col{display:flex;flex-direction:column}
.center{align-items:center;text-align:center}
.handwrap{display:flex;flex-direction:column;gap:6px}
.handlbl{align-items:center}
.float{position:fixed;z-index:50;font-size:36px;line-height:1;pointer-events:none;transform:translate(-50%,-50%);animation:floatup 1.6s ease-out forwards}
.float.txt{font-family:"Cairo",var(--body);font-size:17px;font-weight:800;background:var(--ink);color:var(--cardink);padding:7px 12px;border-radius:16px;white-space:nowrap;animation-duration:2.2s;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.emo.wide{width:54px}
.emo.on{background:var(--butter)}
.phrs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}
.phr{appearance:none;border:0;background:var(--raise);color:var(--ink);border-radius:999px;padding:7px 12px;font-family:"Cairo",var(--body);font-weight:800;font-size:14px;cursor:pointer}
.phr:active{transform:scale(.94)}
.coderow{display:flex;gap:8px;width:100%;max-width:280px}
.coderow input{padding:9px 12px;font-size:16px;text-align:center;letter-spacing:.2em}
.ffbtn.nope{animation:shake .35s}
.opts{gap:12px}
.orow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ol{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:10px}
.opts .segs{flex-wrap:wrap;justify-content:flex-end}
.opts .seg{font-size:13px;padding:6px 10px}
.gtogs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.gtog{appearance:none;border:2px solid var(--line);background:transparent;color:var(--dim);border-radius:10px;padding:7px 9px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;text-align:left;text-decoration:line-through}
.gtog span{font-size:17px}
.gtog.on{border-color:var(--mint);color:var(--ink);text-decoration:none}
.gtog[disabled],.seg[disabled]{cursor:default}
.linkbtn{appearance:none;border:0;background:none;color:var(--butter);font-weight:800;font-size:12px;cursor:pointer;text-decoration:underline;padding:0}
.big[data-act]{cursor:default;user-select:none;-webkit-user-select:none}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-280%) scale(1)}}
.emos{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.emo{appearance:none;border:0;background:var(--panel);border-radius:999px;width:42px;height:42px;font-size:21px;cursor:pointer;display:grid;place-items:center;transition:transform .1s;padding:0}
.emo:active{transform:scale(.85)}
.emo:focus-visible,.x2:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.x2{appearance:none;border:2px solid var(--butter);background:transparent;color:var(--butter);border-radius:999px;padding:5px 14px;font-family:var(--display);font-size:14px;cursor:pointer;letter-spacing:.02em}
.x2.on{background:var(--butter);color:var(--cardink);animation:pulse 1s ease-in-out infinite}
.x2[disabled]{opacity:.35;cursor:default;border-color:var(--line);color:var(--dim);animation:none}
@keyframes pulse{50%{transform:scale(1.08)}}
.target{font-family:var(--display);background:var(--mint);color:var(--cardink);padding:4px 14px;border-radius:999px;font-size:16px}
.rc .xb{position:absolute;top:4px;right:4px;font-size:10px;background:var(--cardink);color:var(--butter);padding:1px 4px;border-radius:4px;font-family:var(--body);font-weight:800}
.chip .nm small.fire{color:var(--coral);font-weight:800}
.chip .nm small.hasx{color:var(--butter);font-weight:800}
.chip .st.late{animation:fade .35s both;animation-delay:calc(var(--n)*.14s + .4s)}
.timer i.intro{background:var(--butter)}
.stage{flex:1;min-height:340px;background:var(--panel);border-radius:20px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.stage .hand{width:100%}
.goal{font-family:var(--display);font-size:18px;color:var(--butter)}
.intro{flex:1;background:var(--coral);color:var(--cardink);border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;animation:slam .45s cubic-bezier(.2,1.6,.4,1) both}
.gicon{font-size:56px;line-height:1}
.gname{font-family:var(--display);font-size:clamp(26px,8vw,38px);line-height:1}
.gen{margin:0;font-size:18px;font-weight:700;max-width:30ch}
.gar{margin:0;font-family:"Cairo",var(--body);font-size:18px;font-weight:800;max-width:32ch;opacity:.85}
.cdwrap{display:flex;flex-direction:column;align-items:center;margin-top:6px}
.cdl{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.cd{font-family:var(--display);font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.pad{appearance:none;border:0;width:100%;flex:1;min-height:300px;border-radius:20px;font-family:var(--display);font-size:clamp(28px,9vw,44px);cursor:pointer;color:var(--cardink);transition:background .05s}
.pad.wait{background:var(--coral)}
.pad.go{background:var(--mint)}
.pad.bad{background:var(--raise);color:var(--coral)}
.pad.done{background:var(--butter)}
.count{font-family:var(--display);font-size:clamp(64px,22vw,110px);line-height:1;color:var(--butter);font-variant-numeric:tabular-nums}
.mashbtn{appearance:none;border:0;width:min(240px,70vw);aspect-ratio:1;border-radius:50%;background:var(--coral);color:var(--cardink);font-family:var(--display);font-size:34px;cursor:pointer;box-shadow:0 8px 0 var(--coral-d)}
.mashbtn.hit{animation:hit .12s}
.mashbtn[disabled]{opacity:.5;box-shadow:none}
.stopb{background:var(--mint);box-shadow:0 8px 0 var(--mint-d)}
@keyframes hit{50%{transform:scale(.92) translateY(4px)}}
.score{font-family:var(--display);font-size:18px;color:var(--mint)}
.q{font-family:var(--display);font-size:clamp(40px,13vw,64px);line-height:1;color:var(--ink)}
.shake{animation:shake .35s}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.choice{appearance:none;border:0;border-radius:14px;background:var(--butter);color:var(--cardink);font-family:var(--display);font-size:28px;padding:18px 0;cursor:pointer;box-shadow:0 5px 0 var(--butter-d)}
.choice.wrong{background:var(--raise);color:var(--coral);box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:340px}
.cell{appearance:none;border:0;background:var(--raise);border-radius:10px;aspect-ratio:1;font-size:clamp(22px,7vw,32px);cursor:pointer;padding:0;display:grid;place-items:center}
.cell.wrong{background:var(--coral)}
.watch{font-family:var(--display);font-size:clamp(56px,18vw,90px);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.watch.shown{color:var(--butter)}
.word{font-family:var(--display);font-size:clamp(44px,14vw,72px);line-height:1;min-height:1.1em}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.sw{appearance:none;border:3px solid var(--ink);border-radius:16px;aspect-ratio:1;cursor:pointer}

<body>
<div id="shell"><div id="app"></div><aside id="chat" class="chat" hidden></aside></div>
<button id="chatfab" class="chatfab" data-act="chat" hidden aria-label="Open chat">💬<b id="unread" hidden></b></button>

<script>
const BROADCAST_DELAY = 50;
const HEARTBEAT_INTERVAL = 2000;
const GUEST_TIMEOUT = 9000;
const HOST_TIMEOUT = 7000;
const RETRY_DELAY = 2500;
const JOIN_TIMEOUT = 20000;
const RESUME_TIMEOUT = 70000;
const RESUME_ATTEMPTS = 20;
const FAREWELL_DELAY = 200;
const NETWORK_ERRORS = new Set(["network", "server-error", "socket-error", "socket-closed"]);

function joinPeerRoom(hostId, role, { resume = false, options = {} } = {}) {
  return new Promise((resolve, reject) => {
    const listeners = [];
    const presences = new Map();
    const updatedAt = new Map();
    const connections = new Map();
    const lastSeen = new Map();

    let own = {};
    let selfId = null;
    let snapshot = Object.freeze([]);
    let hostConnection = null;
    let peer = null;
    let closed = false;
    let settled = false;
    let broadcastTimer = null;
    let retryTimer = null;
    let lastHostMessage = 0;
    let attempts = 0;
    let ended = false;

    const notify = () => {
      const peers = [];
      if (selfId) {
        peers.push(
          Object.freeze({
            peer: selfId,
            sameTab: true,
            presence: Object.freeze({ ...own }),
            updatedAt: performance.now(),
          }),
        );
      }
      for (const [id, presence] of presences) {
        if (id === selfId) continue;
        peers.push(Object.freeze({ peer: id, sameTab: false, presence, updatedAt: updatedAt.get(id) || 0 }));
      }
      snapshot = Object.freeze(peers);
      for (const listener of listeners.slice()) {
        try {
          listener({ peers: snapshot });
        } catch (error) {
          console.error(error);
        }
      }
    };

    const roster = () => {
      const list = [[selfId, own, 0]];
      for (const [id, presence] of presences)
        if (id !== selfId) list.push([id, presence, updatedAt.get(id) || 0]);
      return { type: "roster", list };
    };

    const sendRoster = () => {
      const message = roster();
      for (const connection of connections.values()) {
        if (!connection.open) continue;
        try {
          connection.send(message);
        } catch {}
      }
    };

    const scheduleBroadcast = () => {
      if (broadcastTimer) return;
      broadcastTimer = setTimeout(() => {
        broadcastTimer = null;
        sendRoster();
      }, BROADCAST_DELAY);
    };

    const sendOwnPresence = () => {
      if (!hostConnection?.open) return;
      try {
        hostConnection.send({ type: "presence", presence: own });
      } catch {}
    };

    const scheduleReconnect = () => {
      if (closed || retryTimer) return;
      retryTimer = setTimeout(() => {
        retryTimer = null;
        connectToHost();
      }, RETRY_DELAY);
    };

    const dropHost = () => {
      const connection = hostConnection;
      hostConnection = null;
      try {
        connection?.close();
      } catch {}
      presences.clear();
      updatedAt.clear();
      notify();
      scheduleReconnect();
    };

    const acceptRoster = (list) => {
      lastHostMessage = performance.now();
      ended = false;
      presences.clear();
      updatedAt.clear();
      for (const entry of list) {
        if (!Array.isArray(entry)) continue;
        const [id, presence, time] = entry;
        if (typeof id !== "string" || !presence || typeof presence !== "object") continue;
        presences.set(id, Object.freeze({ ...presence }));
        updatedAt.set(id, typeof time === "number" ? time : 0);
      }
      notify();
    };

    function connectToHost() {
      if (closed || !peer || peer.destroyed) return;
      if (peer.disconnected) {
        try {
          peer.reconnect();
        } catch {}
        scheduleReconnect();
        return;
      }
      if (hostConnection) {
        const stale = hostConnection;
        hostConnection = null;
        try {
          stale.close();
        } catch {}
      }

      let connection;
      try {
        connection = peer.connect(hostId, { reliable: true });
      } catch {
        connection = null;
      }
      if (!connection) {
        scheduleReconnect();
        return;
      }
      hostConnection = connection;

      connection.on("open", () => {
        if (connection !== hostConnection) return;
        lastHostMessage = performance.now();
        sendOwnPresence();
        if (!settled) {
          settled = true;
          notify();
          resolve(api);
        }
      });
      connection.on("data", (message) => {
        if (connection !== hostConnection) return;
        if (message?.type === "roster" && Array.isArray(message.list)) acceptRoster(message.list);
        else if (message?.type === "closed") {
          ended = true;
          presences.clear();
          updatedAt.clear();
          notify();
        }
      });
      const lost = () => connection === hostConnection && dropHost();
      connection.on("close", lost);
      connection.on("error", lost);
    }

    function acceptGuest(connection) {
      const id = connection.peer;
      connection.on("open", () => {
        const previous = connections.get(id);
        if (previous && previous !== connection) {
          try {
            previous.close();
          } catch {}
        }
        connections.set(id, connection);
        lastSeen.set(id, performance.now());
        scheduleBroadcast();
      });
      const drop = () => {
        if (connections.get(id) !== connection) return;
        connections.delete(id);
        presences.delete(id);
        updatedAt.delete(id);
        lastSeen.delete(id);
        notify();
        scheduleBroadcast();
      };
      connection.on("data", (message) => {
        if (connections.get(id) !== connection) return;
        lastSeen.set(id, performance.now());
        if (message?.type === "leave") {
          drop();
          return;
        }
        if (message?.type !== "presence" || !message.presence || typeof message.presence !== "object") return;
        presences.set(id, Object.freeze({ ...message.presence }));
        updatedAt.set(id, performance.now());
        notify();
        scheduleBroadcast();
      });
      connection.on("close", drop);
      connection.on("error", drop);
    }

    const heartbeat = setInterval(() => {
      if (closed) {
        clearInterval(heartbeat);
        return;
      }
      const now = performance.now();
      if (role === "host") {
        for (const [id, connection] of [...connections]) {
          if (now - (lastSeen.get(id) ?? now) <= GUEST_TIMEOUT) continue;
          connections.delete(id);
          presences.delete(id);
          updatedAt.delete(id);
          try {
            connection.close();
          } catch {}
          notify();
        }
        sendRoster();
      } else if (hostConnection?.open) {
        try {
          hostConnection.send({ type: "ping" });
        } catch {}
        if (now - lastHostMessage > HOST_TIMEOUT) dropHost();
      }
    }, HEARTBEAT_INTERVAL);

    const fail = (code) => {
      settled = true;
      closed = true;
      clearInterval(heartbeat);
      try {
        peer?.destroy();
      } catch {}
      reject({ code });
    };

    const api = {
      hostId,
      peers: () => snapshot,
      onPeers(listener) {
        listeners.push(listener);
        setTimeout(() => listener({ peers: snapshot }), 0);
        return () => {
          const index = listeners.indexOf(listener);
          if (index >= 0) listeners.splice(index, 1);
        };
      },
      async presence(patch) {
        for (const key in patch) {
          if (patch[key] === null) delete own[key];
          else own[key] = patch[key];
        }
        if (role === "host") scheduleBroadcast();
        else sendOwnPresence();
        notify();
      },
      async leave() {
        if (closed) return;
        closed = true;
        clearTimeout(retryTimer);
        clearTimeout(broadcastTimer);
        clearInterval(heartbeat);
        const farewell = { type: role === "host" ? "closed" : "leave" };
        const targets = role === "host" ? [...connections.values()] : [hostConnection];
        for (const connection of targets) {
          if (!connection?.open) continue;
          try {
            connection.send(farewell);
          } catch {}
        }
        const leaving = peer;
        setTimeout(() => {
          try {
            leaving?.destroy();
          } catch {}
        }, FAREWELL_DELAY);
      },
      ended: () => ended,
      connected: () =>
        role === "host"
          ? Boolean(peer && !peer.disconnected && !peer.destroyed)
          : Boolean(hostConnection?.open),
    };

    function start() {
      if (closed) return;
      const current = role === "host" ? new window.Peer(hostId, options) : new window.Peer(options);
      peer = current;

      current.on("open", (id) => {
        if (current !== peer) return;
        selfId = id;
        if (role === "guest") {
          if (!hostConnection) connectToHost();
        } else if (!settled) {
          settled = true;
          notify();
          resolve(api);
        }
      });

      if (role === "host") current.on("connection", acceptGuest);

      current.on("disconnected", () => {
        setTimeout(() => {
          if (closed || current !== peer || !current.disconnected || current.destroyed) return;
          try {
            current.reconnect();
          } catch {}
        }, 1500);
      });

      current.on("error", (error) => {
        if (current !== peer) return;
        const type = error?.type;
        if (settled) {
          if (type === "peer-unavailable" && role === "guest") dropHost();
          return;
        }
        const retry = (delay) => {
          attempts++;
          try {
            current.destroy();
          } catch {}
          setTimeout(start, delay);
        };
        if (type === "unavailable-id" && role === "host" && resume && attempts < RESUME_ATTEMPTS) retry(3000);
        else if (type === "peer-unavailable" && role === "guest" && attempts < 1) {
          hostConnection = null;
          retry(800);
        } else if (type === "peer-unavailable" && role === "guest") fail("not_found");
        else if (NETWORK_ERRORS.has(type) && attempts < 3) retry(1500);
        else fail(type === "unavailable-id" ? "taken" : type || "upstream_error");
      });
    }

    start();
    setTimeout(
      () => {
        if (!settled) fail("timeout");
      },
      role === "host" && resume ? RESUME_TIMEOUT : JOIN_TIMEOUT,
    );
  });
}

const SLOT_COUNT = 16;
const SLOT_PREFIX = "crashpot-pub-";
const SCAN_INTERVAL = 2500;
const PROBE_TIMEOUT = 4000;
const LISTING_LIFETIME = 8000;
const SERVE_LINGER = 6000;
const SETTLE_DELAY = 1400;

const slotId = (slot) => `${SLOT_PREFIX}${slot}`;

function safely(action) {
  try {
    return action();
  } catch {
    return undefined;
  }
}

function waitForOpen(peer) {
  return new Promise((resolve, reject) => {
    if (peer.open) {
      resolve(peer);
      return;
    }
    const timer = setTimeout(() => reject({ code: "timeout" }), PROBE_TIMEOUT * 2);
    peer.on("open", () => {
      clearTimeout(timer);
      resolve(peer);
    });
    peer.on("error", (error) => {
      if (peer.open) return;
      clearTimeout(timer);
      reject({ code: error?.type === "unavailable-id" ? "taken" : error?.type || "unavailable" });
    });
  });
}

function createServer(options, getListing) {
  let peer = null;
  let claiming = null;
  const guests = new Set();

  const send = (connection) => {
    if (!connection.open) return;
    safely(() => connection.send({ type: "listing", listing: getListing() }));
  };

  const accept = (connection) => {
    guests.add(connection);
    connection.on("open", () => send(connection));
    const forget = () => guests.delete(connection);
    connection.on("close", forget);
    connection.on("error", forget);
    setTimeout(() => {
      forget();
      safely(() => connection.close());
    }, SERVE_LINGER);
  };

  const claim = async () => {
    for (let slot = 0; slot < SLOT_COUNT; slot++) {
      const candidate = new window.Peer(slotId(slot), options);
      try {
        await waitForOpen(candidate);
        candidate.on("connection", accept);
        candidate.on("disconnected", () => {
          setTimeout(() => {
            if (peer === candidate && candidate.disconnected && !candidate.destroyed)
              safely(() => candidate.reconnect());
          }, 1500);
        });
        return candidate;
      } catch (error) {
        safely(() => candidate.destroy());
        if (error.code !== "taken") return null;
      }
    }
    return null;
  };

  return {
    async publish() {
      if (peer && !peer.destroyed) {
        guests.forEach(send);
        return;
      }
      claiming ??= claim().finally(() => (claiming = null));
      const claimed = await claiming;
      if (!getListing()) {
        safely(() => claimed?.destroy());
        return;
      }
      peer = claimed;
    },
    withdraw() {
      safely(() => peer?.destroy());
      peer = null;
      guests.clear();
    },
  };
}

function createScanner(options, onChange) {
  let peer = null;
  let settled = false;
  let settleTimer = null;
  const listings = new Map();
  const probing = new Map();

  const forget = (slot) => {
    probing.get(slot)?.();
    if (listings.delete(slot)) onChange();
  };

  const ensurePeer = () => {
    if (peer && !peer.destroyed) {
      if (peer.disconnected) safely(() => peer.reconnect());
      return peer.open ? peer : null;
    }
    const created = new window.Peer(options);
    peer = created;
    created.on("open", () => {
      if (peer === created) scan();
    });
    created.on("error", (error) => {
      if (error?.type !== "peer-unavailable") return;
      const text = String(error.message ?? "");
      const at = text.lastIndexOf(SLOT_PREFIX);
      const slot = at < 0 ? NaN : parseInt(text.slice(at + SLOT_PREFIX.length), 10);
      if (Number.isInteger(slot)) forget(slot);
    });
    return null;
  };

  const probe = (scanner, slot) => {
    if (probing.has(slot)) return;
    const connection = safely(() => scanner.connect(slotId(slot), { reliable: true }));
    if (!connection) return;
    const finish = () => {
      if (probing.get(slot) !== finish) return;
      probing.delete(slot);
      safely(() => connection.close());
    };
    probing.set(slot, finish);
    connection.on("data", (message) => {
      if (message?.type !== "listing") return;
      if (message.listing && typeof message.listing === "object") {
        listings.set(slot, { listing: message.listing, seenAt: performance.now() });
      } else {
        listings.delete(slot);
      }
      onChange();
      finish();
    });
    connection.on("error", finish);
    connection.on("close", finish);
    setTimeout(finish, PROBE_TIMEOUT);
  };

  function scan() {
    const scanner = ensurePeer();
    if (scanner) {
      for (let slot = 0; slot < SLOT_COUNT; slot++) probe(scanner, slot);
      settleTimer ??= setTimeout(() => {
        settled = true;
        onChange();
      }, SETTLE_DELAY);
    }
    const now = performance.now();
    let expired = false;
    for (const [slot, entry] of listings) {
      if (now - entry.seenAt <= LISTING_LIFETIME) continue;
      listings.delete(slot);
      expired = true;
    }
    if (expired) onChange();
  }

  return {
    scan,
    listings: () => [...listings.values()].map((entry) => entry.listing),
    settled: () => settled || listings.size > 0,
    close() {
      clearTimeout(settleTimer);
      safely(() => peer?.destroy());
      peer = null;
      listings.clear();
    },
  };
}

async function openPeerDirectory(options, { browsing = () => true } = {}) {
  const listeners = new Set();
  let own = {};
  let closed = false;

  const snapshot = () => {
    const mine = own.listing?.code;
    const peers = scanner.listings().map((listing) => ({
      sameTab: listing.code === mine,
      presence: { listing },
    }));
    if (own.listing) peers.push({ sameTab: true, presence: { ...own } });
    return peers;
  };
  const notify = () => {
    if (closed) return;
    const peers = snapshot();
    listeners.forEach((listener) => safely(() => listener({ peers })));
  };

  const scanner = createScanner(options, notify);
  const server = createServer(options, () => own.listing ?? null);
  const tick = () => {
    if (!closed && browsing() && !document.hidden) scanner.scan();
  };
  const timer = setInterval(tick, SCAN_INTERVAL);
  tick();
  setTimeout(tick, 1200);

  return {
    peers: snapshot,
    settled: () => scanner.settled(),
    onPeers(listener) {
      listeners.add(listener);
      return () => listeners.delete(listener);
    },
    async presence(patch) {
      for (const key in patch) {
        if (patch[key] === null) delete own[key];
        else own[key] = patch[key];
      }
      if (own.listing) await server.publish();
      else server.withdraw();
      notify();
    },
    async leave() {
      closed = true;
      clearInterval(timer);
      server.withdraw();
      scanner.close();
    },
  };
}

function bBotAct(id){

  if(f.cd<=0&&r<(lvl==="hard"?.45:.3)){if(f.role==="healer"&&f.hp>=f.max-1)return{k:"atk",tg};return R.tgt?{k:"sp",tg}:{k:"sp"}}

function bResolve(){
  const alive=bAlive(),A={},lines=[],dmg={},heal={},hitBy={};
  alive.forEach(id=>{A[id]=bValid(id,actOf(id));dmg[id]=0;heal[id]=0;hitBy[id]=[]});
  const parry=new Set(alive.filter(id=>A[id]&&(A[id].k==="parry"||(A[id].k==="sp"&&G.f[id].role==="tank"))));
  const hit=(a,t,amt,unblock,label)=>{
    if(G.f[t].role==="berserk")amt+=1;
    if(parry.has(t)&&!unblock){dmg[a]+=2;lines.push([`🛡 ${nm(t)} parried ${nm(a)}! ${nm(a)} −2`,`${nm(t)} صد ضربة ${nm(a)}!`]);return}
    dmg[t]+=amt;hitBy[t].push(a);lines.push([`${label} ${nm(a)} → ${nm(t)} −${amt}`,`${nm(a)} ضرب ${nm(t)}`]);
  };
  for(const id of alive){
    const a=A[id],f=G.f[id],R=ROLES[f.role];
    if(!a){lines.push([`😶 ${nm(id)} froze`,`${nm(id)} اتنح ومعملش حاجة`]);continue}
    const bonus=f.chg?3:0;
    if(a.k==="atk"){hit(id,a.tg,R.atk+bonus,false,"⚔️");f.chg=0}
    else if(a.k==="chg"){f.chg=1;lines.push([`⚡ ${nm(id)} is charging up`,`${nm(id)} بيشحن`])}
    else if(a.k==="parry"){f.lp=G.bt}
    else if(a.k==="sp"){
      f.cd=3;
      if(f.role==="fighter"){hit(id,a.tg,R.atk+3+bonus,false,"💥");f.chg=0}
      else if(f.role==="ninja"){hit(id,a.tg,R.atk+bonus,true,"🥷");f.chg=0}
      else if(f.role==="healer"){heal[id]+=4;lines.push([`💚 ${nm(id)} healed +4`,`${nm(id)} عالج نفسه`])}
      else if(f.role==="tank"){heal[id]+=2;f.lp=G.bt;lines.push([`🏰 ${nm(id)} built a fortress +2`,`${nm(id)} عمل قلعة`])}
      else if(f.role==="berserk"){for(const t of alive)if(t!==id)hit(id,t,2+bonus,false,"🔥");f.chg=0}
    }

  }

  G.blog=lines;G.bdied=died;
}

function newCode(){const a="bcdfghjkmnpqrstvwxz23456789";let s="";for(let i=0;i<8;i++)s+=a[ri(a.length)];return s}
function openList(){
  if(!dir)return[];
  const list=[];
  for(const p of dir.peers()){
    const l=p.presence&&p.presence.listing;
    if(p.sameTab||!l||typeof l.code!=="string"||!/^[a-z0-9]{4,12}$/.test(l.code))continue;
    if(list.some(x=>x.code===l.code))continue;
    const n=Math.min(MAXP,Math.max(0,+l.n||0)),b=Math.min(MAXP,Math.max(0,+l.b||0));
    list.push({code:l.code,host:clean(l.host)||"Someone",n,b,st:String(l.st||""),r:+l.r||0,l:+l.l||0});
  }
  const rank=g=>(g.st==="lobby"&&g.n+g.b<MAXP?0:g.st==="locked"?2:1);
  return list.sort((a,b)=>rank(a)-rank(b)||b.n-a.n||a.code.localeCompare(b.code));
}

async function enter(c,create){
  if(joining||screen!=="menu")return;
  if(!window.Peer){menuNote="Online didn't load. Check your internet, or tap Practice.";renderMenuBits();return}
  saveName();
  c=String(c||"").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,12);
  if(!c)return;
  joining=true;menuNote=create?"Opening your lobby…":"Joining…";renderMenuBits();
  let joined=null,tries=0;
  while(!joined){
    try{joined=await joinPeerRoom("crashpot-g-"+c,create?"host":"guest",{options:PEER_OPTS})}
    catch(e){
      if(create&&e&&e.code==="taken"&&tries++<3){c=newCode();continue}
      joining=false;
      menuNote=e&&e.code==="not_found"?"That lobby closed. Pick another one.":"Couldn't connect. Tap it again.";
      renderMenuBits();return;
    }
  }
  joining=false;menuNote="";
  nr=joined;code=c;practice=false;G=null;mySub=null;isHost=false;enteredAt=Date.now();lostSince=0;
  nr.presence({pid:me.pid,name:me.name,col:me.col,res:null,g:null}).catch(()=>{});
  nr.onPeers(()=>sync());
  if(create){isHost=true;G=newLobby();hostTick(true)}
  screen="room";render();
}

}

function overParts(){
  const ranked=G.roster.slice().sort((a,b)=>(G.total[b.id]||0)-(G.total[a.id]||0)||(G.wins[b.id]||0)-(G.wins[a.id]||0));
  const top=G.total[ranked[0].id]||0,winners=ranked.filter(p=>(G.total[p.id]||0)===top);
  const head=winners.length>1?"Tie game!":`${esc(winners[0].name)} wins!`;
  const pl=["1st","2nd","3rd","4th","5th","6th"];
  let place=0,prev=null;
  const rows=ranked.map((p,i)=>{const s=G.total[p.id]||0;if(s!==prev){place=i;prev=s}return `<div class="rk${place===0?" first":""}" data-pid="${esc(p.id)}"><span class="p">${pl[place]}</span><span class="n">${esc(p.name)}${p.id===me.pid?" (you)":""}</span><span class="s">${s}</span></div>`}).join("");
  const facts=[];
  const mw=ranked.slice().sort((a,b)=>(G.wins[b.id]||0)-(G.wins[a.id]||0))[0];
  if(mw&&G.wins[mw.id])facts.push(`<div class="fact">Most games won: <b>${esc(mw.name)}</b> (${G.wins[mw.id]})</div>`);
  for(const id in G.rec){const g=GAMES[id],r=G.rec[id];if(g&&g.rec)facts.push(`<div class="fact">${g.i} ${esc(g.rec.label)}: <b>${esc(nameOf(r.id))}</b>, ${esc((g.rec.fmt||g.fmt)(r.v,{}))}</div>`)}
  return{
    "s-top":topBar("GAME OVER"),
    "s-table":`<div class="table"><div class="headline">${head}</div><div class="rank">${rows}</div>${facts.length?`<div class="facts">${facts.join("")}</div>`:""}</div>`,
    "s-act":`<div class="actions">${isHost?`<button class="btn primary" data-act="again">Play again</button>`:`<p class="note grow">Waiting for the host to tap Play again.</p>`}</div>`,
    "s-emo":emoBar()
  };
}

function layout(v,ids){
  const root=$("#app");
  if(root.dataset.v===v)return;
  stopStage();
  root.dataset.v=v;root.dataset.s="room";
  root.innerHTML=ids.map(id=>id==="timer"?`<div class="timer"><i id="bar"></i></div>`:`<div id="${id}"${id==="s-table"||id==="s-stage"?` class="grow col"`:""}></div>`).join("");
}
function part(id,html,force){
  const el=document.getElementById(id);
  if(!el)return;
  if(!force&&el.dataset.k===html)return;
  el.dataset.k=html;el.innerHTML=html;
}
function stopStage(){if(unmount){try{unmount()}catch(e){}unmount=null}stageKey=""}
function renderStage(){
  const el=$("#s-stage");if(!el)return;
  const key=G.gid+"-"+G.k+"-"+G.phase;
  if(G.phase==="play"){
    if(stageKey===key)return;
    stopStage();stageKey=key;el.dataset.k="";
    if(!inRoster()){el.innerHTML=`<div class="table"><div class="headline">You're watching</div><p class="sub">You'll play next round.</p></div>`;return}
    const g=cur(),start=localStart();
    const ctx={data:G.data,start,end:start+g.play,submit,done:()=>!!(mySub&&mySub.g===G.gid&&mySub.k===G.k)||!G||G.phase!=="play"};
    el.innerHTML="";
    unmount=g.mount(el,ctx);
    return;
  }
  if(stageKey!==key){stopStage();stageKey=key;el.dataset.k=""}
  part("s-stage",G.phase==="intro"?introHTML():resultHTML());
}
function render(){
  try{renderMain()}finally{renderChat()}
}
function renderMain(){
  const root=$("#app");
  if(screen==="menu"){
    if(root.dataset.s!=="menu"){stopStage();root.innerHTML=menuHTML();root.dataset.s="menu";root.dataset.v=""}
    renderMenuBits();return;
  }
  if(!G){layout("wait",["s-top","s-table"]);part("s-top",topBar("LOBBY"));part("s-table",`<div class="table"><div class="headline">Connecting…</div><p class="sub">Getting the game from the host.</p></div>`);return}
  if(G.phase==="lobby"){layout("lobby",["s-top","s-head","s-list","s-act","s-opts","s-emo"]);const p=lobbyParts();for(const k in p)part(k,p[k]);return}
  if(G.phase==="over"){layout("over",["s-top","s-table","s-act","s-emo"]);const p=G.mode==="cards"?cOverParts():G.mode==="brawl"?bOverParts():G.mode==="hide"?hOverParts():overParts();for(const k in p)part(k,p[k]);return}
  if(G.mode==="cards"){cRender();return}
  if(G.mode==="brawl"){bRender();return}
  if(G.mode==="hide"){hRender();return}
  layout("game",["s-top","timer","s-chips","s-stage","s-emo"]);
  part("s-top",topBar(G.mode==="single"?`${cur().i} ROUND <b>${G.k+1}</b>/${G.list.length}`:`STAGE <b>${G.k+1}</b>/${G.list.length}`));
  part("s-chips",chipsHTML());
  renderStage();
  part("s-emo",emoBar());
  frameOnce();
}
function frameOnce(){
  if(screen!=="room"||!G||G.phase==="lobby"||G.phase==="over")return;
  const bar=$("#bar");if(!bar)return;
  const now=Date.now(),start=localStart();
  const total=G.phase==="play"&&cur()?cur().play:G.dur;
  const left=Math.max(0,start+total-now),pct=total?Math.min(1,left/total):0;
  bar.style.transform=`scaleX(${pct.toFixed(4)})`;
  bar.classList.toggle("hot",["play","pick","turn","role","hide","seek"].includes(G.phase)&&left<3000);
  const sc=$("#secs");if(sc){const t=["pick","turn","role","hide","seek"].includes(G.phase)?Math.ceil(left/1000)+"s":"";if(sc.textContent!==t)sc.textContent=t}
  bar.classList.toggle("intro",G.phase==="intro");
  const cd=$("#cd");
  if(cd){const n=Math.ceil(left/1000);if(cd.textContent!==String(n)){cd.textContent=n;if(n!==lastCd&&n<=3&&n>0)tone(440,.06,"square",.03);lastCd=n}}
}
function frame(){frameOnce();if(G&&G.mode==="hide"&&G.phase==="hide"&&screen==="room")hTrack();requestAnimationFrame(frame)}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==="quick")quickPlay();
  else if(a==="create")enter(newCode(),true);
  else if(a==="opengame")enter(b.dataset.code,false);
  else if(a==="practice")startPractice();
  else if(a==="leave")leave();
  else if(a==="addbot")addBot();
  else if(a==="rmbot")rmBot(b.dataset.id);
  else if(a==="len")setLen(+b.dataset.n);
  else if(a==="opt")setOpt(b.dataset.k,b.dataset.v);
  else if(a==="x2")cToggleX2();
  else if(a==="px2")togglePX2();
  else if(["brole","bact","btg"].includes(a))bClick(a,b);
  else if(["hhide","hmove","hsel","hgo"].includes(a))hClick(a,b);
  else if(a==="chat"){if(!wide()){chatOpen=true;unread=0;renderChat();setTimeout(()=>{const i=$("#chatin");if(i)i.focus()},50)}else{const i=$("#chatin");if(i)i.focus()}}
  else if(a==="chatclose"){chatOpen=false;renderChat()}
  else if(a==="chatsend")sendChat();
  else if(a==="sh")cToggleSh();
  else if(a==="pk")cPeek();
  else if(a==="ff")toggleFF();
  else if(a==="secret")secretTap();
  else if(a==="ffcode")tryCode();
  else if(a==="phr"){showPhr=!showPhr;render()}
  else if(a==="start"||a==="again")startGame();
  else if(a==="emo")sendEmo(+b.dataset.i);
  else if(a==="mute"){muted=!muted;ls.set("cp.mute",muted?"1":"0");if(!muted)tone(660,.08,"square",.03);render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="ffcode")tryCode()});
document.addEventListener("input",e=>{
  if(e.target.id==="nm"){const v=clean(e.target.value);if(v){me.name=v;ls.set("cp.name",v)}}
});

setInterval(()=>{if(isHost)hostTick();else watchdog()},100);
render();
requestAnimationFrame(frame);
function loadScript(src){return new Promise(r=>{const s=document.createElement("script");s.src=src;s.onload=()=>r(true);s.onerror=()=>r(false);document.head.append(s)})}
(async()=>{
  for(const src of["https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js","https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"]){if(window.Peer)break;await loadScript(src)}
  if(!window.Peer){netState="none";renderMenuBits();return}
  try{dir=await openPeerDirectory(PEER_OPTS,{browsing:()=>screen==="menu"})}catch(e){dir=null}
  netState=dir?"ok":"none";
  if(dir)dir.onPeers(()=>{if(screen==="menu")renderMenuBits()});
  render();renderMenuBits();
})();
window.addEventListener("pagehide",()=>{try{nr&&nr.leave()}catch(e){}});
</script>
